# Example experiment:
# Robust Cross-Sectional Momentum Across Liquid Multi-Asset ETFs.
#
# Research question: Can cross-sectional momentum generate stable out-of-sample
# risk-adjusted returns across liquid ETFs after transaction costs and
# volatility targeting?
experiment_name: cross_sectional_momentum_etfs

data:
  instruments:
    - symbol: SPY   # US large cap
      source: yahoo
      calendar: XNYS
    - symbol: QQQ   # US tech / Nasdaq 100
      source: yahoo
      calendar: XNYS
    - symbol: IWM   # US small cap
      source: yahoo
      calendar: XNYS
    - symbol: EFA   # Developed ex-US
      source: yahoo
      calendar: XNYS
    - symbol: EEM   # Emerging markets
      source: yahoo
      calendar: XNYS
    - symbol: TLT   # Long US treasuries
      source: yahoo
      calendar: XNYS
    - symbol: GLD   # Gold
      source: yahoo
      calendar: XNYS
    - symbol: VNQ   # US real estate
      source: yahoo
      calendar: XNYS
  start_date: "2008-01-01"
  end_date: "2025-12-31"
  frequency: "1d"
  missing_value_policy: "drop"

strategy:
  name: cross_sectional_momentum
  parameters:
    lookback_period: 252     # ~12 months
    skip_period: 21          # exclude the most recent month
    top_fraction: 0.25
    bottom_fraction: 0.25
    long_short: false        # long-only for the main version
    signal_scaling: binary

portfolio:
  allocator: inverse_volatility
  maximum_weight: 0.30
  maximum_gross_exposure: 1.0
  maximum_net_exposure: 1.0
  target_volatility: 0.12
  volatility_window: 63
  maximum_leverage: 1.5
  rebalance_frequency: monthly

execution:
  commission_bps: 2.0
  spread_bps: 3.0
  slippage_bps: 2.0
  slippage_model: constant

backtest:
  initial_capital: 100000
  benchmark:
    symbol: SPY
    source: yahoo
    calendar: XNYS
  risk_free_rate: 0.02
  periods_per_year: 252

validation:
  method: walk_forward
  train_window: 1000
  validation_window: 252
  test_window: 126
  expanding: true
  optimization_metric: sharpe
  # Freeze the published search space: tune timing while keeping the 25%
  # selection breadth fixed as part of this experiment's hypothesis.
  parameter_grid:
    lookback_period: [126, 189, 252]
    skip_period: [0, 21]

reproducibility:
  random_seed: 42

robustness:
  stress_test:
    enabled: true
  bootstrap:
    enabled: true
    n_iterations: 1000
    block_size: 5
  permutation_test:
    enabled: true
    n_iterations: 1000
  sensitivity:
    enabled: true
    # Signal timing vs selection breadth — distinct from the walk-forward
    # grid above (lookback_period/skip_period), not a repeat of it.
    parameters:
      lookback_period: [126, 189, 252]
      top_fraction: [0.10, 0.25, 0.50]
