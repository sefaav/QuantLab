# Minimal default configuration. A small Yahoo Finance experiment used as a
# template and for smoke tests when network data are available.
experiment_name: default_buy_and_hold

data:
  source: yahoo
  symbols:
    - SPY
    - QQQ
  start_date: "2015-01-01"
  end_date: "2024-12-31"
  frequency: "1d"
  missing_value_policy: "drop"

strategy:
  name: buy_and_hold
  parameters: {}

portfolio:
  allocator: equal_weight
  maximum_weight: 1.0
  rebalance_frequency: monthly

execution:
  commission_bps: 1.0
  spread_bps: 1.0
  slippage_bps: 1.0
  slippage_model: constant

backtest:
  initial_capital: 100000
  # symbol | equal_weight | first_asset | cash
  benchmark_kind: symbol
  # Used only by the symbol benchmark.
  benchmark_symbol: SPY
  risk_free_rate: 0.0
  periods_per_year: 252

validation:
  method: holdout
  validation_ratio: 0.2
  test_ratio: 0.2

reproducibility:
  random_seed: 42

# `quantlab stress-test|bootstrap|permutation-test --config
# configs/default.yaml` each run regardless of `enabled` below (only the
# `robustness` orchestrator reads it). No `sensitivity` block: buy_and_hold
# has no strategy parameters to sweep.
robustness:
  stress_test:
    enabled: true
  bootstrap:
    enabled: true
  permutation_test:
    enabled: true
