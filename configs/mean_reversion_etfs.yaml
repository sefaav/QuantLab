# Example experiment: mean reversion on liquid ETFs using a
# rolling z-score of price. Compared against RSI / Bollinger variants in the
# research notebook.
experiment_name: mean_reversion_etfs

data:
  source: yahoo
  symbols:
    - SPY
    - QQQ
    - IWM
    - EFA
    - EEM
  start_date: "2010-01-01"
  end_date: "2025-12-31"
  frequency: "1d"
  missing_value_policy: "drop"

strategy:
  name: mean_reversion
  parameters:
    lookback_period: 20
    entry_zscore: 2.0
    exit_zscore: 0.5
    stop_zscore: 4.0
    long_only: true

portfolio:
  allocator: equal_weight
  maximum_weight: 0.5
  rebalance_frequency: daily

execution:
  commission_bps: 2.0
  spread_bps: 3.0
  slippage_bps: 2.0
  slippage_model: constant

backtest:
  initial_capital: 100000
  benchmark_symbol: SPY
  risk_free_rate: 0.02
  periods_per_year: 252

validation:
  method: holdout
  validation_ratio: 0.2
  test_ratio: 0.2

reproducibility:
  random_seed: 42

robustness:
  stress_test:
    enabled: true
  bootstrap:
    enabled: true
  permutation_test:
    enabled: true
  sensitivity:
    enabled: true
    parameters:
      lookback_period: [10, 20, 40]
      entry_zscore: [1.5, 2.0, 2.5]
