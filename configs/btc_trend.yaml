# Example experiment: trend following on Bitcoin.
# Crypto uses 365 periods/year and higher costs than ETFs.
experiment_name: btc_trend_following

data:
  instruments:
    - symbol: BTCUSDT
      source: binance
      calendar: "24/7"
  start_date: "2018-01-01"
  end_date: "2025-12-31"
  frequency: "1d"
  missing_value_policy: "drop"

strategy:
  name: trend_following
  parameters:
    fast_window: 20
    slow_window: 100
    long_only: true

portfolio:
  allocator: volatility_targeting
  target_volatility: 0.40
  volatility_window: 30
  maximum_leverage: 2.0
  rebalance_frequency: daily

execution:
  # Crypto: wider spreads and higher slippage than ETFs.
  commission_bps: 10.0
  spread_bps: 8.0
  slippage_bps: 10.0
  slippage_model: constant

backtest:
  initial_capital: 100000
  benchmark:
    symbol: BTCUSDT
    source: binance
    calendar: "24/7"
  risk_free_rate: 0.0
  periods_per_year: 365   # crypto trades every calendar day

validation:
  method: holdout
  validation_ratio: 0.2
  test_ratio: 0.2

reproducibility:
  random_seed: 42

# `quantlab stress-test|bootstrap|permutation-test|sensitivity --config
# configs/btc_trend.yaml` each run one technique regardless of `enabled`
# below (only the `robustness` orchestrator reads it). validation.method is
# holdout above, so every technique here evaluates a single plain backtest.
robustness:
  stress_test:
    enabled: true
  bootstrap:
    enabled: true
  permutation_test:
    enabled: true
  sensitivity:
    enabled: true
    parameters:
      fast_window: [10, 20, 40]
      slow_window: [50, 100, 200]
