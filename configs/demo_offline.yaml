# Offline demo experiment. Uses the `csv` data source reading synthetic files
# from data/raw/, so `quantlab backtest`/`walk-forward` run with no network.
# NOTE: the prices here are SYNTHETIC (generated), not real market data.
experiment_name: demo_offline_momentum

research_question: >-
  Does cross-sectional momentum on this small offline demo universe
  produce a stable out-of-sample signal, purely as a fast, no-network
  illustration of the walk-forward pipeline?
hypothesis: >-
  H1: the walk-forward pipeline selects a consistent momentum parameter
  across folds on this synthetic demo data. H0: fold-to-fold selection is
  effectively random. (Demo data is synthetic -- not evidence about real
  markets either way.)

data:
  # The synthetic symbols model US equity ETFs.
  instruments:
    - symbol: SPY
      source: csv
      calendar: XNYS
    - symbol: QQQ
      source: csv
      calendar: XNYS
    - symbol: TLT
      source: csv
      calendar: XNYS
    - symbol: GLD
      source: csv
      calendar: XNYS
  start_date: "2019-01-01"
  end_date: "2023-10-30"
  frequency: "1d"
  missing_value_policy: "drop"
  # Allow the installed package to use its bundled synthetic demo files.
  use_bundled_demo_data: true

strategy:
  name: cross_sectional_momentum
  parameters:
    lookback_period: 189
    skip_period: 21
    top_fraction: 0.5
    bottom_fraction: 0.5
    long_short: false
    signal_scaling: binary
  # Price series the strategy's own generate_signals() reads. Execution/
  # costs always use the raw close regardless of this setting.
  signal_price_type: adjusted_close

portfolio:
  allocator: inverse_volatility
  maximum_weight: 0.60
  maximum_gross_exposure: 1.0
  target_volatility: 0.12
  volatility_window: 63
  maximum_leverage: 1.5
  rebalance_frequency: monthly

execution:
  commission_bps: 2.0
  spread_bps: 3.0
  slippage_bps: 2.0
  slippage_model: constant

backtest:
  initial_capital: 100000
  benchmark:
    symbol: SPY
    source: csv
    calendar: XNYS
  risk_free_rate: 0.02
  periods_per_year: 252

validation:
  method: walk_forward
  train_window: 500
  validation_window: 126
  test_window: 126
  # Advance between consecutive folds' train windows. Omit (or set equal to
  # test_window) for the default: contiguous, non-overlapping test blocks.
  step: 126
  expanding: true
  optimization_metric: sharpe

reproducibility:
  random_seed: 42

# `quantlab stress-test|bootstrap|permutation-test|sensitivity --shipped-config
# demo_offline` each run one technique regardless of `enabled` below (only
# the `robustness` orchestrator reads it). Since validation.method is
# walk_forward above, stress-test and sensitivity re-run the whole
# walk-forward process per scenario/cell (slower, still fast offline on
# this small bundled dataset); bootstrap and permutation-test just resample
# the already-realised OOS returns.
robustness:
  stress_test:
    enabled: true
    # Each list is a set of magnitudes evaluated independently (one
    # scenario row per value); an empty list disables that scenario type
    # entirely.
    commission_multipliers: [2.0, 5.0]
    slippage_multipliers: [2.0]
    execution_delays: [1]
    best_days_removed: [10]
    reduce_universe_by: [1]
  bootstrap:
    enabled: true
    # Width of the reported p_lower/p_upper percentile band (0.90 -> the
    # 5th/95th percentiles).
    confidence_level: 0.90
  permutation_test:
    enabled: true
  sensitivity:
    enabled: true
    parameters:
      lookback_period: [126, 189, 252]
      top_fraction: [0.25, 0.50]

# Where and what a run saves. Omit entirely for the default: reports/
# generated/<experiment_name>/, both artefact toggles enabled.
output:
  # directory: reports/generated/demo_offline_momentum
  save_html_report: true
  save_figures: true
