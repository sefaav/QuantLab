# Pre-commit hooks.
# Install with:  pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep aligned with the Ruff version pinned in uv.lock and used by CI.
    rev: v0.16.1
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (project development environment)
        entry: python -m mypy
        language: system
        # Type-check the same complete scope as CI, independent of changed files.
        pass_filenames: false
        always_run: true
        args: ["src", "tests", "scripts"]
